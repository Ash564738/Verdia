services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_plant_care
      POSTGRES_USER: plantcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantcare -d smart_plant_care"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./data:/app/data", "./models:/app/models"]
    environment:
      DATABASE_URL: postgresql://plantcare:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/smart_plant_care
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
